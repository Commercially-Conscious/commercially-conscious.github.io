name: Publish Weekly Digest

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build weekly digest
        run: node scripts/publish-weekly-digest.mjs

      - name: Commit and push if a new digest was written
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Weekly roundup: automated digest'
          commit_user_name: Commercially Conscious Bot
          commit_user_email: ebikar19@gmail.com
          file_pattern: 'src/content/digests/*.md'
